name: Publish news

on:
  schedule:
    # 3x/day while the site is young. After a month with no issues you can
    # speed up (e.g. "0 */2 * * *" for every 2 hours).
    - cron: "0 */8 * * *"
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab
  push:
    branches: [main]             # rebuild the site when you edit config/pages

permissions:
  contents: write                # to commit generated posts + images back
  pages: write                   # to deploy to GitHub Pages
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate articles
        # only generate on the schedule or a manual run, not on config pushes
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Backfill featured images
        # runs every time; only fills posts that are missing an image (idempotent)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backfill_images.py

      - name: Commit new posts + images
        run: |
          git config user.name "autonews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/posts static/images seen.json
          git commit -m "auto: publish articles + images [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Build static site
        run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
